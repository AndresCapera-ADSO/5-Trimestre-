<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="assets/img/favicon.png" type="image/x-icon">
    <link rel="stylesheet" href="assets/css/style.css">
    <title>Restablecer Contraseña</title>
</head>
<body>

    <!-- Encabezado principal -->
    <header>
        <h1>Restablecer</h1>
        <button class="toggle-button" id="toggle-button" aria-label="Menú de navegación"></button>
        <nav>
            <ul>
                <li><a href="index.html">Iniciar Sesión</a></li>
                <li><a href="register.html">Registrarse</a></li>
                <li><a href="#">Contacto</a></li>
            </ul>
        </nav>
    </header>

    <!-- Contenedor del formulario (Forzamos la altura automática para que no se corte) -->
    <div class="login-container" style="height: auto !important; min-height: max-content;">
        <form action="/update-password" method="POST" style="height: auto !important; padding-bottom: 30px;">
            
            <div class="form-title" style="text-align: center; margin-bottom: 20px;">
                <!-- Icono decorativo de seguridad -->
                <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#4CAF50" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-bottom: 10px;">
                    <path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"></path>
                </svg>
                
                <h2 style="margin: 0; color: #333; font-size: 1.4rem;">Crear nueva contraseña</h2>
                <p style="color: #666; font-size: 0.85rem; line-height: 1.4; margin-top: 10px;">
                    Ingresa tu nueva contraseña a continuación. Asegúrate de que sea segura.
                </p>
            </div>

            <!-- Contenedor para mensajes de error -->
            <div class="validation-message" id="validation-message"></div>

            <label for="new-password" style="font-weight: 600; color: #444;">Nueva Contraseña:</label>
            <input 
                type="password" 
                id="new-password" 
                name="new-password" 
                pattern="^(?=.*[a-z])(?=.*[A-Z])(?=.*\d).+$"
                title="Debe tener al menos una letra minúscula, una letra mayúscula y un número"
                placeholder="••••••••" 
                autocomplete="new-password"
                style="margin-bottom: 15px;"
                required>

            <label for="confirm-password" style="font-weight: 600; color: #444;">Confirmar Contraseña:</label>
            <input 
                type="password" 
                id="confirm-password" 
                name="confirm-password" 
                placeholder="••••••••" 
                autocomplete="new-password"
                style="margin-bottom: 20px;"
                required>

            <!-- Línea de separación -->
            <hr style="border: 0; height: 1px; background: #e0e0e0; margin-bottom: 20px;">

            <!-- Botón de envío visible -->
            <button type="submit" style="width: 100%; margin: 0;">Guardar contraseña</button>
        </form>
    </div>

    <!-- Pie de página -->
    <footer>
        <p>&copy; 2026 Andres Capera. Todos los derechos reservados.</p>
    </footer>

    <!-- Scripts de validación -->
    <script src="assets/js/main.js"></script>
</body>
</html>
