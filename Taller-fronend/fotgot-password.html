
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="assets/img/favicon.png" type="image/x-icon">
    <link rel="stylesheet" href="assets/css/style.css">
    <title>Recuperar Contraseña</title>
</head>
<body>

    <!-- Preloader -->
    <div class="preloader" id="preloader">
        <div class="spinner">Cargando...</div>
    </div>

    <!-- Header Principal -->
    <header>
        <h1>Recuperación</h1>
        <button class="toggle-button" id="toggle-button" aria-label="Menú de navegación"></button>
        <nav>
            <ul>
                <li><a href="index.html">Login</a></li>
                <li><a href="register.html">Register</a></li>
                <li><a href="#">Contact</a></li>
            </ul>
        </nav>
    </header>

    <!-- Formulario de Recuperación -->
    <div class="login-container">
        <form action="/reset-password" method="POST">
            
            <div class="form-title">
                <h2>¿Olvidaste tu contraseña?</h2>
                <p>Ingresa tu correo y te enviaremos las instrucciones.</p>
            </div>

            <div class="validation-message" id="validation-message"></div>

            <label for="email">Correo Electrónico:</label>
            <input 
                type="email" 
                id="email" 
                name="email" 
                placeholder="correo@ejemplo.com" 
                autocomplete="email"
                required>

            <button type="submit">Enviar instrucciones</button>

            <!-- Enlace de regreso al login -->
            <div style="text-align: center; margin-top: 15px;">
                <a href="index.html" style="color: #666; font-size: 0.9rem; text-decoration: none; font-weight: bold;">Volver a iniciar sesión</a>
            </div>
        </form>
    </div>

    <!-- Footer -->
    <footer>
        <p>&copy; 2026 Andres Capera. All rights reserved.</p>
    </footer>

    <!-- Script de lógica -->
    <script src="assets/js/main.js"></script>
</body>
</html>
